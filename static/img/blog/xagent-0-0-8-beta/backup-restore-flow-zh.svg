<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">xAgent 在线备份与灾难恢复流程</title>
  <desc id="desc">运行中的 xAgent 生成加密增量快照并写入 S3 或 WebDAV，恢复时在线准备数据，停机后切换目录，验证成功后确认或失败后回滚。</desc>
  <rect width="1600" height="900" fill="#0b1220"/>
  <text x="92" y="95" fill="#f8fafc" font-family="Inter, Noto Sans SC, sans-serif" font-size="44" font-weight="700">xAgent 在线备份与灾难恢复</text>
  <text x="92" y="142" fill="#a7b2c5" font-family="Inter, Noto Sans SC, sans-serif" font-size="24">逻辑全量快照，物理增量上传；准备阶段在线完成，目录切换必须停机</text>

  <rect x="92" y="210" width="300" height="190" rx="12" fill="#152033" stroke="#3b82f6" stroke-width="3"/>
  <text x="126" y="262" fill="#60a5fa" font-family="Inter, Noto Sans SC, sans-serif" font-size="24" font-weight="700">01 运行中的 xAgent</text>
  <text x="126" y="312" fill="#f8fafc" font-family="Inter, Noto Sans SC, sans-serif" font-size="27" font-weight="600">数据目录与 SQLite</text>
  <text x="126" y="354" fill="#b9c3d4" font-family="Inter, Noto Sans SC, sans-serif" font-size="21">白名单收集、在线数据库备份</text>

  <path d="M410 305 H490" stroke="#64748b" stroke-width="4"/>
  <path d="M480 293 L498 305 L480 317" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="510" y="210" width="390" height="190" rx="12" fill="#152033" stroke="#22c55e" stroke-width="3"/>
  <text x="544" y="262" fill="#4ade80" font-family="Inter, Noto Sans SC, sans-serif" font-size="24" font-weight="700">02 加密与增量上传</text>
  <text x="544" y="312" fill="#f8fafc" font-family="Inter, Noto Sans SC, sans-serif" font-size="27" font-weight="600">内容寻址对象</text>
  <text x="544" y="354" fill="#b9c3d4" font-family="Inter, Noto Sans SC, sans-serif" font-size="21">只上传新增或变化内容</text>

  <path d="M918 305 H998" stroke="#64748b" stroke-width="4"/>
  <path d="M988 293 L1006 305 L988 317" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="1018" y="210" width="490" height="190" rx="12" fill="#152033" stroke="#f59e0b" stroke-width="3"/>
  <text x="1052" y="262" fill="#fbbf24" font-family="Inter, Noto Sans SC, sans-serif" font-size="24" font-weight="700">03 备份仓库</text>
  <text x="1052" y="312" fill="#f8fafc" font-family="Inter, Noto Sans SC, sans-serif" font-size="27" font-weight="600">S3 / 兼容 S3 / WebDAV</text>
  <text x="1052" y="354" fill="#b9c3d4" font-family="Inter, Noto Sans SC, sans-serif" font-size="21">完整快照清单 + recovery.yml</text>

  <rect x="92" y="490" width="360" height="205" rx="12" fill="#152033" stroke="#22d3ee" stroke-width="3"/>
  <text x="126" y="542" fill="#67e8f9" font-family="Inter, Noto Sans SC, sans-serif" font-size="24" font-weight="700">04 在线准备恢复</text>
  <text x="126" y="592" fill="#f8fafc" font-family="Inter, Noto Sans SC, sans-serif" font-size="27" font-weight="600">下载、校验、重组</text>
  <text x="126" y="635" fill="#b9c3d4" font-family="Inter, Noto Sans SC, sans-serif" font-size="21">此时不覆盖当前数据目录</text>

  <path d="M470 592 H550" stroke="#64748b" stroke-width="4"/>
  <path d="M540 580 L558 592 L540 604" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="570" y="490" width="400" height="205" rx="12" fill="#152033" stroke="#ef4444" stroke-width="3"/>
  <text x="604" y="542" fill="#f87171" font-family="Inter, Noto Sans SC, sans-serif" font-size="24" font-weight="700">05 停机后切换目录</text>
  <text x="604" y="592" fill="#f8fafc" font-family="Inter, Noto Sans SC, sans-serif" font-size="27" font-weight="600">backup restore --continue</text>
  <text x="604" y="635" fill="#b9c3d4" font-family="Inter, Noto Sans SC, sans-serif" font-size="21">运行中会被文件锁阻止</text>

  <path d="M988 592 H1068" stroke="#64748b" stroke-width="4"/>
  <path d="M1058 580 L1076 592 L1058 604" fill="none" stroke="#64748b" stroke-width="4"/>

  <rect x="1088" y="490" width="420" height="205" rx="12" fill="#152033" stroke="#a78bfa" stroke-width="3"/>
  <text x="1122" y="542" fill="#c4b5fd" font-family="Inter, Noto Sans SC, sans-serif" font-size="24" font-weight="700">06 启动并验证</text>
  <text x="1122" y="592" fill="#4ade80" font-family="Inter, Noto Sans SC, sans-serif" font-size="25" font-weight="700">通过：--confirm</text>
  <text x="1122" y="635" fill="#f87171" font-family="Inter, Noto Sans SC, sans-serif" font-size="25" font-weight="700">失败：停机后 --rollback</text>

  <rect x="92" y="770" width="1416" height="62" rx="10" fill="#111a2b" stroke="#334155"/>
  <text x="120" y="810" fill="#d6deeb" font-family="Inter, Noto Sans SC, sans-serif" font-size="21">边界：公共目录中接入的第三方 S3 / WebDAV 内容不进入 xAgent 备份，应由对应存储服务单独保护。</text>
</svg>
