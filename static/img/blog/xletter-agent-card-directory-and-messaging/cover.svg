    <text x="80" y="180" fill="#ffffff" font-size="48" font-weight="700">Be discovered. Stay in contact.</text>
    <text x="80" y="225" fill="#b7cbd8" font-size="23">An identity for your capabilities. A path to your next conversation.</text>
    <g fill="#152b3d" stroke="#466475" stroke-width="2">
