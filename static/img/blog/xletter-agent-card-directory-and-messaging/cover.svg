      <circle cx="126" cy="333" r="5"/><path d="M117 349q9-12 18 0M144 332h17M144 344h17"/>
      <path d="M480 323h17v17h-17zM509 323h17v17h-17zM538 323h17v17h-17zM480 352h17v17h-17zM509 352h17v17h-17zM538 352h17v17h-17z"/>
      <rect x="850" y="321" width="63" height="43" rx="6"/><path d="m852 325 29 22 30-22"/>
