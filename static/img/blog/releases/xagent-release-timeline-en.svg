<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">xAgent 0.1.0 → 0.1.1</title><desc id="desc">Official release milestones and scope; not a performance benchmark.</desc><rect width="1200" height="570" rx="24" fill="#f2f7f3"/><g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="50" y="62" font-size="32" fill="#173d30">From team collaboration to everyday reliability</text><text x="50" y="100" font-size="19" fill="#507366">Official release-note dates · Server only</text><rect x="50" y="150" width="500" height="290" rx="18" fill="white" stroke="#b8d3c2"/><text x="78" y="195" font-size="20" fill="#507366">2026-10-18</text><text x="78" y="240" font-size="36" fill="#173d30">v0.1.0</text><text x="78" y="300" font-size="22" fill="#173d30">Virtual teams &amp; shared materials</text><text x="78" y="342" font-size="22" fill="#173d30">Whole-team archiving &amp; recovery</text><text x="78" y="384" font-size="22" fill="#173d30">Cookie sessions &amp; secret boundaries</text><rect x="650" y="150" width="500" height="290" rx="18" fill="white" stroke="#b8d3c2"/><text x="678" y="195" font-size="20" fill="#507366">2026-10-23</text><text x="678" y="240" font-size="36" fill="#173d30">v0.1.1</text><text x="678" y="300" font-size="22" fill="#173d30">Model-save connection tests</text><text x="678" y="342" font-size="22" fill="#173d30">Retry countdown with stop / continue</text><text x="678" y="384" font-size="22" fill="#173d30">Trigger history &amp; Session fixes</text><path d="M567 285 H627 M615 273 L627 285 L615 297" fill="none" stroke="#28754c" stroke-width="5"/><text x="50" y="495" font-size="24" fill="#173d30">4 platform packages per release: Linux / macOS × AMD64 / ARM64</text><text x="50" y="535" font-size="20" fill="#507366">Clients, AgentPlugins, and runtime assets keep independent versions.</text></g></svg>