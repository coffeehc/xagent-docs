<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">xAgent 0.1.0 → 0.1.1</title><desc id="desc">Official release milestones and scope; not a performance benchmark.</desc><rect width="1200" height="570" rx="24" fill="#f2f7f3"/><g font-family="Noto Sans CJK SC, Arial, sans-serif"><text x="50" y="62" font-size="32" fill="#173d30">从团队协作，到日常运行体验</text><text x="50" y="100" font-size="19" fill="#507366">日期采用官方发布说明 · 仅 Server 更新</text><rect x="50" y="150" width="500" height="290" rx="18" fill="white" stroke="#b8d3c2"/><text x="78" y="195" font-size="20" fill="#507366">2026-10-18</text><text x="78" y="240" font-size="36" fill="#173d30">v0.1.0</text><text x="78" y="300" font-size="22" fill="#173d30">虚拟团队与共享资料</text><text x="78" y="342" font-size="22" fill="#173d30">团队整体归档与执行恢复</text><text x="78" y="384" font-size="22" fill="#173d30">Cookie 会话与密钥执行边界</text><rect x="650" y="150" width="500" height="290" rx="18" fill="white" stroke="#b8d3c2"/><text x="678" y="195" font-size="20" fill="#507366">2026-10-23</text><text x="678" y="240" font-size="36" fill="#173d30">v0.1.1</text><text x="678" y="300" font-size="22" fill="#173d30">保存模型时自动测试连接</text><text x="678" y="342" font-size="22" fill="#173d30">重试倒计时，可停止或继续</text><text x="678" y="384" font-size="22" fill="#173d30">触发器历史与会话状态修复</text><path d="M567 285 H627 M615 273 L627 285 L615 297" fill="none" stroke="#28754c" stroke-width="5"/><text x="50" y="495" font-size="24" fill="#173d30">每版 4 个平台包：Linux / macOS × AMD64 / ARM64</text><text x="50" y="535" font-size="20" fill="#507366">客户端、AgentPlugin 与运行时资源包继续独立版本管理。</text></g></svg>