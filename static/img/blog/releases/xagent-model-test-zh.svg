<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Model save and connection test</title><desc id="desc">Saving tests the connection. A failed configuration can be saved but needs repair before task use.</desc><rect width="1200" height="430" rx="24" fill="#f2f7f3"/><g font-family="Noto Sans CJK SC, Arial, sans-serif"><text x="50" y="60" font-size="32" fill="#173d30">v0.1.1 · 模型配置检查路径</text><rect x="50" y="115" width="300" height="90" rx="16" fill="white" stroke="#b8d3c2"/><text x="80" y="170" font-size="25" fill="#173d30">保存模型配置</text><rect x="450" y="115" width="300" height="90" rx="16" fill="white" stroke="#b8d3c2"/><text x="480" y="170" font-size="25" fill="#173d30">自动测试连接</text><rect x="850" y="115" width="300" height="90" rx="16" fill="white" stroke="#b8d3c2"/><text x="880" y="170" font-size="25" fill="#173d30">查看测试结果</text><path d="M370 160 h55 m-12 -12 l12 12 l-12 12" fill="none" stroke="#28754c" stroke-width="4"/><path d="M770 160 h55 m-12 -12 l12 12 l-12 12" fill="none" stroke="#28754c" stroke-width="4"/><text x="50" y="265" font-size="25" fill="#173d30">新模型默认最大输出：16K，可按实际模型限制调整</text><text x="50" y="320" font-size="23" fill="#173d30">测试失败：配置仍可保存；先修复连接，再用于任务。</text><text x="50" y="375" font-size="21" fill="#507366">升级后模型未出现在选择列表？先到模型管理页完成连接测试。</text></g></svg>